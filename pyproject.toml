[project]
name = "qwen3-asr-server"
version = "0.1.0"
description = "OpenAI-compatible HTTP server for Qwen3-ASR (vLLM-backed) with context priming and CPU fallback."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Michel Belleau", email = "michel@malaiwah.com" }]
keywords = ["asr", "qwen3", "speech-to-text", "vllm", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
gpu = ["qwen-asr[vllm]"]
cpu = ["transformers>=4.45", "torch>=2.4"]
test = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23"]

[project.scripts]
qwen3-asr-server = "server:main"

[project.urls]
Homepage = "https://github.com/malaiwah/qwen3-asr-server"
"Bug Tracker" = "https://github.com/malaiwah/qwen3-asr-server/issues"
"Companion TTS Server" = "https://github.com/malaiwah/qwen3-tts-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
